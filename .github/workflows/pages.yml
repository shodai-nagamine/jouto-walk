name: Deploy to GitHub Pages

# public/ をそのまま配信する。ビルド手順は無い(three.js は同梱、モジュールは素のESM)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは打ち切らない。打ち切ると Pages 側で
# "Deployment cancelled" となり、成果物を上げ直しても反映されないため
# (GitHub のPages公式サンプルも false を推奨)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 開発ログを git log から作るので全履歴が要る
      - name: 開発ログを生成
        run: python3 tools/build_changelog.py --out public/data/changelog.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # timeout は 600000ms(10分)が上限で、それ以上を書いても丸められる。
      # Pages側の配信がこれを超えると job は failure になるが、配信自体は
      # 後から完了して公開される(= 赤いバツでもサイトは更新されていることがある)。
      - id: deployment
        uses: actions/deploy-pages@v4
